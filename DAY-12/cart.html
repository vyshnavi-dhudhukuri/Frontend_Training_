<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Store</title>
    <link rel="stylesheet" href="cart.css">
</head>
<body>

    <nav>
        <div class="logo">MyStore</div>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Products</a></li>
            <li><a href="#">Cart</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <div class="container">

        <div class="card">
            <img src="samsungs25ultra.jpeg" alt="Product">
            <h2>Samsung S25 Ultra</h2>
            <p class="price">₹90,000/-</p>
            <button>Add to Cart</button>
        </div>

        <div class="card">
            <img src="shoes.jpg" alt="Product">
            <h2>shoes</h2>
            <p class="price">₹1,299</p>
            <button>Add to Cart</button>
        </div>

        <div class="card">
            <img src="headphones.jpeg" alt="Product">
            <h2>Headphones</h2>
            <p class="price">₹2,499</p>
            <button>Add to Cart</button>
        </div>

        <div class="card">
            <img src="smartwatch.jpeg" alt="Product">
            <h2>Smart Watch</h2>
            <p class="price">₹3,999</p>
            <button>Add to Cart</button>
        </div>

    </div>

</body>
</html>

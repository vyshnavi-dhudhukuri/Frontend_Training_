<!DOCTYPE html>
<html>
<head>
    <title>Navigation Bar</title>
    <style>
        body{
            margin:0;
        }

        .nav{
            display:flex;
            justify-content:space-between;
            align-items:center;
            background-color:#1f1e1e8e;
            padding:10px 30px;
        }

        .logo img{
            width:60px;      
            height:60px;
            object-fit:contain;
        }

        .menu a{
            color:white;
            text-decoration:none;
            margin-left:20px;
            font-size:18px;
            transition:0.3s;
        }

        .menu a:hover{
            color:black;
        }
    </style>
</head>
<body>

    <div class="nav">
        <div class="logo">
            <img src="logo_navbar.png" alt="Logo">
        </div>

        <div class="menu">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </div>
    </div>

</body>
</html>
